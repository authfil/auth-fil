name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **If this is a security vulnerability, please don't file it here** — use [private vulnerability reporting](https://github.com/authloom/auth-loom/security/advisories/new) instead, per [SECURITY.md](../../SECURITY.md).

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where does the bug live? See CONTRIBUTING.md's "Where code goes" table if unsure.
      options:
        - authloom-core
        - authloom-crypto
        - Node adapter
        - Python adapter
        - Go adapter
        - Java adapter
        - Rust adapter
        - Conformance suite
        - Docs site
        - Devtools / tooling
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The crate/package version, or the commit SHA if built from source.
      placeholder: v0.1.0 or 36f2a05
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a minimal code sample that triggers the bug.
      render: shell
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: A checklist of conditions that must hold for this bug to be considered fixed.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust/Node/Python version, and anything else relevant.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, stack traces, or anything else that helps. Redact secrets before pasting.
    validations:
      required: false
