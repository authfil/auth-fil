# cargo-deny policy: `make deny`. Supply chain is part of the security model.

[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerable, unmaintained, yanked) fails the check.
# Exceptions go in `ignore` with a comment explaining why.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences compatible with shipping under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list anticipates future dependencies, so unused entries are fine.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
